name: One-time public static-site discovery

on:
  push:
    branches:
      - agent/static-site-discovery-20260905
    paths:
      - '.github/workflows/.discover-static-sites-once.yml'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out discovery branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/static-site-discovery-20260905
          persist-credentials: true
      - name: Scan public GoreeCloud repositories
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.parse, urllib.request
          from pathlib import PurePosixPath

          token = os.environ['GH_TOKEN']
          headers = {'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r)

          repos=[]
          page=1
          while True:
              batch=get(f'https://api.github.com/users/GoreeCloud/repos?per_page=100&page={page}&type=owner&sort=full_name')
              if not batch: break
              repos.extend(batch); page+=1

          strong_names={'index.html','404.html','_headers','CNAME','site.webmanifest','netlify.toml','wrangler.toml','wrangler.json','wrangler.jsonc'}
          dir_names={'website','websites','site','sites','public-site','public_website','identity-center-site'}
          results=[]
          errors=[]
          for repo in repos:
              if repo.get('private') or repo.get('archived'): continue
              name=repo['name']; branch=repo['default_branch']
              try:
                  tree=get(f"https://api.github.com/repos/GoreeCloud/{name}/git/trees/{urllib.parse.quote(branch,safe='')}?recursive=1")
              except Exception as exc:
                  errors.append({'repository':f'GoreeCloud/{name}','error':str(exc)}); continue
              paths=[e['path'] for e in tree.get('tree',[]) if e.get('type') in {'blob','tree'}]
              roots={}
              def add(root,reason,path):
                  item=roots.setdefault(root,{'root':root,'reasons':set(),'evidence':[]})
                  item['reasons'].add(reason)
                  if len(item['evidence'])<30: item['evidence'].append(path)
              for path in paths:
                  p=PurePosixPath(path)
                  parts=p.parts
                  if p.name in strong_names:
                      if p.name in {'index.html','404.html','_headers','CNAME','site.webmanifest'}:
                          root=str(p.parent) if str(p.parent)!='.' else '/'
                          add(root,f'contains {p.name}',path)
                      elif any(part in dir_names for part in parts[:-1]) or p.parent==PurePosixPath('.'):
                          root=str(p.parent) if str(p.parent)!='.' else '/'
                          add(root,f'contains {p.name}',path)
                  for i,part in enumerate(parts[:-1] if p.suffix else parts):
                      if part in dir_names:
                          root='/'.join(parts[:i+1])
                          add(root,f'directory named {part}',path)
                          break
              if roots:
                  results.append({'repository':repo['full_name'],'default_branch':branch,'head_tree_sha':tree.get('sha'),'tree_truncated':tree.get('truncated',False),'candidates':[{'root':v['root'],'reasons':sorted(v['reasons']),'evidence':v['evidence']} for v in sorted(roots.values(),key=lambda x:x['root'])]})
          out={'schema_version':'1.0','scope':'public non-archived GoreeCloud repositories','generated_from':'GitHub recursive trees','repositories_scanned':len([r for r in repos if not r.get('private') and not r.get('archived')]),'candidate_repositories':results,'errors':errors}
          os.makedirs('docs',exist_ok=True)
          with open('docs/public-static-discovery.json','w',encoding='utf-8') as f: json.dump(out,f,indent=2,sort_keys=True); f.write('\n')
      - name: Commit discovery evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name GoreeCloud
          git config user.email '295260680+GoreeCloud@users.noreply.github.com'
          git add docs/public-static-discovery.json
          git commit -m 'inventory public static website candidates'
          git push origin HEAD:agent/static-site-discovery-20260905
