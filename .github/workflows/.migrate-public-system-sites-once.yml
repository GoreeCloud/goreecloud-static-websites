name: One-time public system-site importer

on:
  push:
    branches:
      - agent/migrate-public-system-sites-20260905
    paths:
      - '.github/workflows/.migrate-public-system-sites-once.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out migration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/migrate-public-system-sites-20260905
          persist-credentials: true
      - name: Import exact public website packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/design /tmp/identity /tmp/mesh /tmp/suite /tmp/suite-tree
          rm -rf sites/design sites/identity sites/mesh sites/suite

          # Design Center: website source plus the exact source dependencies used by website/build.py.
          git clone --quiet https://github.com/GoreeCloud/goreecloud-glaze-ui.git /tmp/design
          git -C /tmp/design checkout --quiet 6b17bec103e8a0dbdf0f16c625fbc2f1ad359e80
          mkdir -p sites/design/website sites/design/css sites/design/assets/identity/official/facet sites/design/reference
          cp -a /tmp/design/website/. sites/design/website/
          rm -rf sites/design/website/dist
          for name in glaze.css glaze.controls.css glaze.expressive.css glaze.formfactors.css glaze.accessibility.css glaze.color.css glaze.motion.css glaze.materials.css glaze.layout.css glaze.states.css glaze-v1.1.0.css glaze-v1.1.css glaze-v1.1-appearance.css glaze-v1.0.0.css glaze-v1.foundation.css glaze-v1.components.css glaze-v1.components.adaptive.css glaze-v1.components.runtime.css glaze-v1.structure.css glaze-v1.overlay.css glaze-v1.advanced.css glaze-v1.visual-refinement.css glaze-v1.optical-reachability.css; do
            cp "/tmp/design/css/$name" "sites/design/css/$name"
          done
          cp /tmp/design/assets/identity/official/facet/glaze-ui-mark.svg sites/design/assets/identity/official/facet/glaze-ui-mark.svg
          cp /tmp/design/reference/v1-system-shell.html sites/design/reference/v1-system-shell.html

          # Identity Center: self-contained public static package only. Upstream authentik docs are excluded.
          git clone --quiet https://github.com/GoreeCloud/goreecloud-identity.git /tmp/identity
          git -C /tmp/identity checkout --quiet 7b0b8f2a391b795f6ddfbfcce006a7e83a414d72
          mkdir -p sites/identity
          git -C /tmp/identity archive 3dd3ca4b4641561c7e94c49336dcae316e8c6f7f | tar -x -C sites/identity

          # Mesh Center: website source plus only its public build/validation/deployment-verification scripts.
          git clone --quiet https://github.com/GoreeCloud/goreecloud-mesh.git /tmp/mesh
          git -C /tmp/mesh checkout --quiet 1002c74a2f014b04719b6809da22b0026546f8f0
          mkdir -p sites/mesh/website sites/mesh/scripts
          git -C /tmp/mesh archive 8969145d7e8ea96eaf2900b4558e8532df19ea32 | tar -x -C sites/mesh/website
          cp /tmp/mesh/scripts/build_public_site.py sites/mesh/scripts/
          cp /tmp/mesh/scripts/validate_public_site.py sites/mesh/scripts/
          cp /tmp/mesh/scripts/verify_public_deployment.py sites/mesh/scripts/

          # Suite: copy the explicit static allowlist and its website-specific build/validation tools.
          git clone --quiet https://github.com/GoreeCloud/goreecloud-suite.git /tmp/suite
          mkdir -p /tmp/suite-tree
          git -C /tmp/suite archive 2cced628d07d2ec48bd838e665e29b9ecb0024a8 | tar -x -C /tmp/suite-tree
          mkdir -p sites/suite/assets sites/suite/scripts
          for name in index.html styles.css glaze-ui-2.1.0.css _headers robots.txt sitemap.xml site.webmanifest; do
            cp "/tmp/suite-tree/$name" "sites/suite/$name"
          done
          cp /tmp/suite-tree/assets/goreecloud-logo.svg sites/suite/assets/goreecloud-logo.svg
          cp -a /tmp/suite-tree/assets/suite sites/suite/assets/suite
          for name in build_public_site.py glaze_ui_2.py validate_site.py validate_responsive_layout.py browser_responsive_smoke.py; do
            cp "/tmp/suite-tree/scripts/$name" "sites/suite/scripts/$name"
          done

          git config user.name GoreeCloud
          git config user.email '295260680+GoreeCloud@users.noreply.github.com'
          git add sites/design sites/identity sites/mesh sites/suite
          git commit -m 'migrate public system static website sources'
          git push origin HEAD:agent/migrate-public-system-sites-20260905
