name: Validate Blog static site

on:
  pull_request:
    paths:
      - 'sites/blog/**'
      - 'scripts/build_simple_static_site.py'
      - 'scripts/validate_simple_static_site.py'
      - 'scripts/simple_static_publication.py'
      - 'scripts/browser_simple_static_site.py'
      - 'scripts/verify_simple_static_deployment.py'
      - 'scripts/browser_simple_static_remote.py'
      - '.github/workflows/validate-blog-site.yml'
  push:
    branches: [main]
    paths:
      - 'sites/blog/**'
      - 'scripts/build_simple_static_site.py'
      - 'scripts/validate_simple_static_site.py'
      - 'scripts/simple_static_publication.py'
      - 'scripts/browser_simple_static_site.py'
      - 'scripts/verify_simple_static_deployment.py'
      - 'scripts/browser_simple_static_remote.py'
      - '.github/workflows/validate-blog-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact website candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out pinned GLAZE UI V1.3 Stable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: GoreeCloud/goreecloud-glaze-ui
          ref: 8354308445da9ac35ced2b37a7f503a08a0aaf72
          path: .glaze-ui
          persist-credentials: false
      - name: Compile Blog publication tools
        run: |
          python -m py_compile \
            sites/blog/validate.py \
            scripts/build_simple_static_site.py \
            scripts/validate_simple_static_site.py \
            scripts/simple_static_publication.py \
            scripts/browser_simple_static_site.py \
            scripts/verify_simple_static_deployment.py \
            scripts/browser_simple_static_remote.py
      - name: Validate Blog public truth contract
        run: python sites/blog/validate.py
      - name: Validate Blog V1.3 source contract
        run: python scripts/validate_simple_static_site.py sites/blog
      - name: Build exact Blog V1.3 artifact
        env:
          GLAZE_UI_SOURCE: ${{ github.workspace }}/.glaze-ui
        run: python scripts/build_simple_static_site.py sites/blog
      - name: Validate Blog built artifact
        run: python scripts/validate_simple_static_site.py sites/blog --dist
      - name: Exercise exact built Blog artifact in Chrome
        run: python scripts/browser_simple_static_site.py blog
      - name: Validate Blog JavaScript syntax
        run: node --check sites/blog/site.js
      - name: Verify canonical Blog production bytes and headers
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/verify_simple_static_deployment.py blog --target production
      - name: Verify canonical Blog production rendering
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/browser_simple_static_remote.py blog
