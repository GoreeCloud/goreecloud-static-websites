name: Validate Blog static site

on:
  pull_request:
    paths:
      - 'sites/blog/**'
      - 'scripts/glaze_v1.py'
      - 'scripts/validate_v1_static_site.py'
      - '.github/workflows/validate-blog-site.yml'
  push:
    branches: [main]
    paths:
      - 'sites/blog/**'
      - 'scripts/glaze_v1.py'
      - 'scripts/validate_v1_static_site.py'
      - '.github/workflows/validate-blog-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact website candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile controlled V1.1 tooling
        run: python -m py_compile scripts/glaze_v1.py scripts/validate_v1_static_site.py sites/blog/build.py
      - name: Build isolated Blog Pages artifact
        run: python sites/blog/build.py
      - name: Validate Blog V1.1 source and artifact
        run: python scripts/validate_v1_static_site.py sites/blog
      - name: Validate Blog JavaScript syntax
        run: node --check sites/blog/site.js
