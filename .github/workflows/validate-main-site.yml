name: Validate main GoreeCloud static site

on:
  pull_request:
    paths:
      - 'sites/main/**'
      - '.github/workflows/validate-main-site.yml'
  push:
    branches: [main]
    paths:
      - 'sites/main/**'
      - '.github/workflows/validate-main-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out pinned GLAZE UI V1.3 Stable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: GoreeCloud/goreecloud-glaze-ui
          ref: 8354308445da9ac35ced2b37a7f503a08a0aaf72
          path: .glaze-ui
          persist-credentials: false
      - name: Confirm generated artifact is not source authority
        run: test ! -e sites/main/dist
      - name: Compile main-site build, browser, and verification tools
        run: |
          python -m py_compile \
            sites/main/scripts/glaze_v1_3.py \
            sites/main/scripts/build_public_site.py \
            sites/main/scripts/validate_build_artifact.py \
            sites/main/scripts/validate_site.py \
            sites/main/scripts/validate_glaze_ui.py \
            sites/main/scripts/validate_responsive_layout.py \
            sites/main/scripts/validate_public_surface.py \
            sites/main/scripts/verify_remote_deployment.py \
            sites/main/scripts/browser_responsive_smoke.py \
            sites/main/scripts/browser_artifact_smoke.py
      - name: Validate main-site source contracts
        run: |
          python sites/main/scripts/validate_glaze_ui.py
          python sites/main/scripts/validate_responsive_layout.py
          python sites/main/scripts/validate_public_surface.py
          python sites/main/scripts/validate_site.py
      - name: Build isolated public artifact from exact GLAZE UI source
        env:
          GLAZE_UI_SOURCE: ${{ github.workspace }}/.glaze-ui
        run: python sites/main/scripts/build_public_site.py
      - name: Validate isolated public artifact against exact GLAZE UI source
        env:
          GLAZE_UI_SOURCE: ${{ github.workspace }}/.glaze-ui
        run: python sites/main/scripts/validate_build_artifact.py
      - name: Exercise exact built artifact in Chrome
        run: python sites/main/scripts/browser_artifact_smoke.py
      - name: Check JavaScript syntax
        run: |
          node --check sites/main/js/theme-init.js
          node --check sites/main/js/main.js
      - name: Verify canonical production bytes and headers
        if: github.event_name == 'workflow_dispatch'
        run: python sites/main/scripts/verify_remote_deployment.py production
      - name: Verify canonical production responsive rendering
        if: github.event_name == 'workflow_dispatch'
        run: python sites/main/scripts/browser_responsive_smoke.py --target production
