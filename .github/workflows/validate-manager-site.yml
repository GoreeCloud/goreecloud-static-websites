name: Validate Manager static site

on:
  pull_request:
    paths:
      - 'sites/manager/**'
      - '.github/workflows/validate-manager-site.yml'
  push:
    branches: [main]
    paths:
      - 'sites/manager/**'
      - '.github/workflows/validate-manager-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact website candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out pinned GLAZE UI V1.3 Stable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: GoreeCloud/goreecloud-glaze-ui
          ref: 8354308445da9ac35ced2b37a7f503a08a0aaf72
          path: .glaze-ui
          persist-credentials: false
      - name: Compile website tools
        run: python -m py_compile sites/manager/scripts/build_public_site.py sites/manager/scripts/validate_public_site.py
      - name: Validate V1.3 source contract
        run: python sites/manager/scripts/validate_public_site.py
      - name: Build exact V1.3 public candidate
        env:
          GLAZE_UI_SOURCE: ${{ github.workspace }}/.glaze-ui
        run: python sites/manager/scripts/build_public_site.py
      - name: Validate built V1.3 artifact
        run: python sites/manager/scripts/validate_public_site.py --dist
      - name: Validate JavaScript syntax
        run: node --check sites/manager/site.js
