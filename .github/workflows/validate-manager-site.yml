name: Validate Manager public-site publication

on:
  pull_request:
    paths:
      - 'sites/manager/**'
      - '.github/workflows/validate-manager-site.yml'
  push:
    branches: [main]
    paths:
      - 'sites/manager/**'
      - '.github/workflows/validate-manager-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manager-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact Manager publication candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out pinned GLAZE UI V1.3 Stable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: GoreeCloud/goreecloud-glaze-ui
          ref: 8354308445da9ac35ced2b37a7f503a08a0aaf72
          path: .glaze-ui
          persist-credentials: false

      - name: Compile Manager build and verification tools
        run: >-
          python -m py_compile
          sites/manager/scripts/build_public_site.py
          sites/manager/scripts/validate_public_site.py
          sites/manager/scripts/verify_public_deployment.py
          sites/manager/scripts/browser_responsive_smoke.py
          sites/manager/scripts/browser_production_smoke.py

      - name: Validate Manager source contract
        run: |
          python sites/manager/scripts/validate_public_site.py
          python sites/manager/scripts/verify_public_deployment.py --check-config
          node --check sites/manager/site.js

      - name: Build reviewed Manager artifact
        env:
          GLAZE_UI_SOURCE: ${{ github.workspace }}/.glaze-ui
        run: python sites/manager/scripts/build_public_site.py

      - name: Validate reviewed Manager artifact
        run: python sites/manager/scripts/validate_public_site.py --dist

      - name: Exercise exact candidate responsive rendering
        run: python sites/manager/scripts/browser_responsive_smoke.py

      - name: Verify canonical Manager production publication
        if: github.event_name == 'workflow_dispatch'
        run: python sites/manager/scripts/verify_public_deployment.py

      - name: Verify canonical Manager production rendering
        if: github.event_name == 'workflow_dispatch'
        run: python sites/manager/scripts/browser_production_smoke.py
