name: Validate centralized public system sites

on:
  pull_request:
    paths:
      - 'sites/design/**'
      - 'sites/identity/**'
      - 'sites/mesh/**'
      - 'sites/security/**'
      - 'sites/suite/**'
      - '.github/workflows/validate-public-system-sites.yml'
  push:
    branches: [main]
    paths:
      - 'sites/design/**'
      - 'sites/identity/**'
      - 'sites/mesh/**'
      - 'sites/security/**'
      - 'sites/suite/**'
      - '.github/workflows/validate-public-system-sites.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python -m py_compile sites/design/website/build.py sites/design/website/validate.py
      - run: python sites/design/website/validate.py
      - run: node --check sites/design/website/site.js

  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate Identity Center GLAZE UI V1.3 source boundary
        shell: python
        run: |
          from pathlib import Path
          root=Path('sites/identity')
          version='1.3.0'
          revision='8354308445da9ac35ced2b37a7f503a08a0aaf72'
          for name in ('index.html','app.js','style.css','glaze-v1.3-consumer.css','_headers','robots.txt','sitemap.xml','assets/identity.svg'):
              if not (root/name).is_file(): raise SystemExit(f'missing Identity Center source: {name}')
          html=(root/'index.html').read_text(encoding='utf-8')
          css=(root/'glaze-v1.3-consumer.css').read_text(encoding='utf-8')
          headers=(root/'_headers').read_text(encoding='utf-8')
          sitemap=(root/'sitemap.xml').read_text(encoding='utf-8')
          for marker in (
              f'name="goreecloud-glaze-ui" content="{version}"',
              f'name="goreecloud-glaze-source-revision" content="{revision}"',
              'name="goreecloud-glaze-consumer-state" content="source-migrated-rendered-acceptance-pending"',
              'data-glaze-version="1.3.0"',
              'glaze-v1.3-consumer.css',
              'GLAZE UI V1.3 source target.',
          ):
              if marker not in html: raise SystemExit(f'missing Identity Center V1.3 marker: {marker}')
          if 'https://identity.goreecloud.com/' not in sitemap:
              raise SystemExit('Identity Center sitemap does not declare the canonical public URL')
          for stale in ('data-glaze-ui="2.1.0"','glaze-ui-2.1.0.css','Glaze UI 2.1.0 Stable consumer acceptance'):
              if stale in html: raise SystemExit(f'superseded active Identity Center Glaze target: {stale}')
          for marker in ('--identity-v13-touch:48px','--identity-v13-touch-assisted:56px','prefers-reduced-motion:reduce','prefers-reduced-transparency:reduce','prefers-contrast:more','forced-colors:active','focus-visible'):
              if marker not in css: raise SystemExit(f'missing Identity Center V1.3 accessibility/adaptation marker: {marker}')
          for marker in ('Content-Security-Policy:','X-Content-Type-Options: nosniff','frame-ancestors'):
              if marker not in headers: raise SystemExit(f'missing Identity Center security header: {marker}')
          for forbidden in ('docs.goauthentik.io','google-analytics','googletagmanager','segment.com'):
              if forbidden in html.lower(): raise SystemExit(f'forbidden/upstream Identity Center dependency: {forbidden}')
          print('Identity Center GLAZE UI V1.3 source boundary validated; rendered/production acceptance remains separate')
      - run: node --check sites/identity/app.js

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate Wardveil Security Center GLAZE UI V1.3 source boundary
        shell: python
        run: |
          from pathlib import Path
          root=Path('sites/security/website')
          version='1.3.0'
          revision='8354308445da9ac35ced2b37a7f503a08a0aaf72'
          for name in ('index.html','404.html','v1.3-site.css','site.css','site.js','build.py','_headers'):
              if not (root/name).is_file(): raise SystemExit(f'missing Security Center source: {name}')
          index=(root/'index.html').read_text(encoding='utf-8')
          error=(root/'404.html').read_text(encoding='utf-8')
          css=(root/'v1.3-site.css').read_text(encoding='utf-8')
          build=(root/'build.py').read_text(encoding='utf-8')
          for html in (index,error):
              for marker in (
                  f'name="goreecloud-glaze-ui" content="{version}"',
                  f'name="goreecloud-glaze-source-revision" content="{revision}"',
                  'name="goreecloud-glaze-consumer-state" content="source-migrated-rendered-acceptance-pending"',
                  'data-glaze-version="1.3.0"',
                  'v1.3-site.css',
              ):
                  if marker not in html: raise SystemExit(f'missing Security Center V1.3 marker: {marker}')
              for stale in ('data-glaze-version="1.1"','data-glaze-ui="1.1.0"','glaze-ui-v1.1.0.css','GLAZE UI V1.1'):
                  if stale in html: raise SystemExit(f'superseded active Security Center Glaze target: {stale}')
          for marker in ('--v13-control:48px','--v13-control-coarse:56px','prefers-reduced-motion:reduce','prefers-reduced-transparency:reduce','prefers-contrast:more','forced-colors:active','focus-visible'):
              if marker not in css: raise SystemExit(f'missing Security Center V1.3 accessibility/adaptation marker: {marker}')
          if 'GLAZE UI V1.3 / 1.3.0' not in build or 'glaze-ui-v1.1.0.css' in build:
              raise SystemExit('Security Center build contract is not V1.3-only')
          print('Wardveil Security Center GLAZE UI V1.3 source boundary validated; rendered/security-runtime/production acceptance remains separate')
      - run: python -m py_compile sites/security/website/build.py
      - run: python sites/security/website/build.py
      - run: node --check sites/security/website/site.js

  mesh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out pinned GLAZE UI V1.3 Stable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: GoreeCloud/goreecloud-glaze-ui
          ref: 8354308445da9ac35ced2b37a7f503a08a0aaf72
          path: .glaze-ui
          persist-credentials: false
      - run: python -m py_compile sites/mesh/scripts/build_public_site.py sites/mesh/scripts/validate_public_site.py sites/mesh/scripts/verify_public_deployment.py
      - run: python sites/mesh/scripts/validate_public_site.py
      - env:
          GLAZE_UI_SOURCE: ${{ github.workspace }}/.glaze-ui
        run: python sites/mesh/scripts/build_public_site.py
      - run: python sites/mesh/scripts/validate_public_site.py --dist
      - run: node --check sites/mesh/website/site.js

  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out pinned GLAZE UI V1.3 Stable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: GoreeCloud/goreecloud-glaze-ui
          ref: 8354308445da9ac35ced2b37a7f503a08a0aaf72
          path: .glaze-ui
          persist-credentials: false
      - run: python -m py_compile sites/suite/scripts/build_public_site.py sites/suite/scripts/validate_site.py sites/suite/scripts/validate_responsive_layout.py sites/suite/scripts/browser_responsive_smoke.py
      - run: python sites/suite/scripts/validate_site.py
      - run: python sites/suite/scripts/validate_responsive_layout.py
      - env:
          GLAZE_UI_SOURCE: ${{ github.workspace }}/.glaze-ui
        run: python sites/suite/scripts/build_public_site.py
      - run: python sites/suite/scripts/validate_site.py --dist
