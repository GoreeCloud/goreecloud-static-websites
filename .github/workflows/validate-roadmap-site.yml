name: Validate Roadmap static site

on:
  pull_request:
    paths:
      - 'sites/roadmap/**'
      - 'scripts/glaze_v1.py'
      - 'scripts/validate_v1_static_site.py'
      - '.github/workflows/validate-roadmap-site.yml'
  push:
    branches: [main]
    paths:
      - 'sites/roadmap/**'
      - 'scripts/glaze_v1.py'
      - 'scripts/validate_v1_static_site.py'
      - '.github/workflows/validate-roadmap-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact website candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile Roadmap and V1.1 tooling
        run: python -m py_compile scripts/glaze_v1.py scripts/validate_v1_static_site.py sites/roadmap/build.py sites/roadmap/validate.py
      - name: Build isolated Roadmap Pages artifact
        run: python sites/roadmap/build.py
      - name: Validate Roadmap V1.1 source and artifact
        run: python scripts/validate_v1_static_site.py sites/roadmap
      - name: Validate Roadmap public truth contract
        run: python sites/roadmap/validate.py
      - name: Validate JavaScript syntax
        run: node --check sites/roadmap/site.js
