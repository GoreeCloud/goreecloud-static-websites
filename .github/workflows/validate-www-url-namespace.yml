name: Validate unified www URL namespace

on:
  pull_request:
    paths:
      - 'sites/**'
      - 'scripts/build_www_namespace.py'
      - 'scripts/validate_url_namespace.py'
      - '.github/workflows/validate-www-url-namespace.yml'
  push:
    branches: [main]
    paths:
      - 'sites/**'
      - 'scripts/build_www_namespace.py'
      - 'scripts/validate_url_namespace.py'
      - '.github/workflows/validate-www-url-namespace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  namespace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Compile URL namespace tooling
        run: python -m py_compile scripts/validate_url_namespace.py scripts/build_www_namespace.py

      - name: Validate governed URL namespace registry
        run: python scripts/validate_url_namespace.py

      - name: Build all informational websites under www.goreecloud.com paths
        run: python scripts/build_www_namespace.py

      - name: Verify required mounted entrypoints
        shell: python
        run: |
          from pathlib import Path
          required = (
              'index.html',
              'projects/index.html',
              'roadmap/index.html',
              'blog/index.html',
              'archive/index.html',
              'suite/index.html',
              'glaze-ui/index.html',
              'privacy-shield/index.html',
              'wardveil/index.html',
              'everkeep/index.html',
              'identity/index.html',
              'manager/index.html',
              'mesh/index.html',
              'labs/index.html',
              '_headers',
              'robots.txt',
          )
          root = Path('dist')
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit(f'missing namespace artifact files: {missing}')
          print(f'Unified namespace entrypoints verified: {len(required)} required files')

      - name: Verify verified-cutover and Manager hostname boundaries
        shell: python
        run: |
          import json
          from pathlib import Path

          registry = json.loads(Path('sites/url-namespace.json').read_text())
          if registry['state'] != 'provider-cutover-verified':
              raise SystemExit('unified namespace registry must retain the verified provider-cutover state')

          redirected = [site for site in registry['sites'] if site.get('legacy_redirect')]
          if len(redirected) != 13:
              raise SystemExit(f'verified informational redirect inventory must remain 13 hosts, found {len(redirected)}')

          manager = next(site for site in registry['sites'] if site['id'] == 'manager')
          if manager.get('current_public_host') != 'manage.goreecloud.com':
              raise SystemExit('Manager informational legacy hostname must remain manage.goreecloud.com until redirect retirement')
          if manager.get('reserved_application_host') != 'manager.goreecloud.com':
              raise SystemExit('manager.goreecloud.com must remain reserved for the Manager web application')
          if not manager.get('legacy_redirect'):
              raise SystemExit('Manager informational legacy hostname must remain marked for compatibility redirect')
          if manager['current_public_host'] == manager['reserved_application_host']:
              raise SystemExit('Manager informational and application hostname boundaries collided')

          mounted = Path('dist/manager/index.html').read_text(encoding='utf-8')
          expected_canonical = '<link rel="canonical" href="https://www.goreecloud.com/manager/">'
          if expected_canonical not in mounted:
              raise SystemExit('mounted Manager artifact does not publish the governed www canonical URL')
          if '<link rel="canonical" href="https://manage.goreecloud.com/">' in mounted:
              raise SystemExit('mounted Manager artifact still publishes the legacy informational canonical URL')

          print('Provider cutover remains verified; final acceptance remains evidence-gated; Manager informational and application hostname boundaries are preserved')
