name: Validate unified www URL namespace

on:
  pull_request:
    paths:
      - 'sites/**'
      - 'scripts/build_www_namespace.py'
      - 'scripts/validate_url_namespace.py'
      - '.github/workflows/validate-www-url-namespace.yml'
  push:
    branches: [main]
    paths:
      - 'sites/**'
      - 'scripts/build_www_namespace.py'
      - 'scripts/validate_url_namespace.py'
      - '.github/workflows/validate-www-url-namespace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  namespace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Compile URL namespace tooling
        run: python -m py_compile scripts/validate_url_namespace.py scripts/build_www_namespace.py

      - name: Validate governed URL namespace registry
        run: python scripts/validate_url_namespace.py

      - name: Build all informational websites under www.goreecloud.com paths
        run: python scripts/build_www_namespace.py

      - name: Verify required mounted entrypoints
        shell: python
        run: |
          from pathlib import Path
          required = (
              'index.html',
              'projects/index.html',
              'roadmap/index.html',
              'blog/index.html',
              'archive/index.html',
              'suite/index.html',
              'glaze-ui/index.html',
              'privacy-shield/index.html',
              'wardveil/index.html',
              'everkeep/index.html',
              'identity/index.html',
              'manager/index.html',
              'mesh/index.html',
              'labs/index.html',
              '_headers',
              'robots.txt',
          )
          root = Path('dist')
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit(f'missing namespace artifact files: {missing}')
          print(f'Unified namespace entrypoints verified: {len(required)} required files')

      - name: Preserve migration boundary
        shell: python
        run: |
          import json
          from pathlib import Path
          registry=json.loads(Path('sites/url-namespace.json').read_text())
          if registry['state'] != 'migration-preparation':
              raise SystemExit('production migration state may only change after live provider and deployed-revision verification')
          manager=next(site for site in registry['sites'] if site['id']=='manager')
          if manager.get('reserved_application_host') != 'manager.goreecloud.com' or manager.get('legacy_redirect'):
              raise SystemExit('Manager application hostname boundary was not preserved')
          print('Migration remains preparation-only; application hostname boundary preserved')
