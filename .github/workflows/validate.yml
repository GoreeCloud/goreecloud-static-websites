name: Validate static website repository

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-websites-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-migration-registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate migration registry
        run: python scripts/validate_manifest.py
      - name: Validate canonical visual identity
        run: python scripts/validate_visual_identity.py
      - name: Compile repository validation tools
        run: python -m py_compile scripts/validate_manifest.py scripts/validate_visual_identity.py
